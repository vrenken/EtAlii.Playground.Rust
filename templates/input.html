{% extends "base.html" %}
{% block content %}
<h3>Hello <span id="display">{{ value }}</span></h3>

<input type="text"
       name="value"
       value="{{ value }}"
       hx-post="/update-name"
       hx-trigger="input changed delay:200ms"
       hx-target="#display"
       hx-swap="textContent" />
{% endblock %}
