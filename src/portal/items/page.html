<body>

<!--{% extends "layout.html" %}-->
<!--{% block content %}-->

<div class="columns" id="item-list">
    <!--{% for item in items %}-->
        <!--{% include "items/item.html" %}-->
    <!--{% endfor %}-->
</div>

<input type="text" name="name" id="new-name" placeholder="Name" />
<input type="number" name="quantity" id="new-qty" placeholder="Quantity" value="1" />

<button
    hx-post="/items/add"
    hx-include="#new-name,#new-qty"
    hx-target="#item-list"
    hx-swap="innerHTML">
    Add
</button>

<!--{% endblock %}-->

</body>
