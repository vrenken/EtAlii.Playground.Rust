[package]
name = "rust-website-01"
version = "0.1.0"
edition = "2024"

[dependencies]
axum =                                  { version = "0.8.6", features = ["tokio" ]}
axum-login =                            { version = "0.18.0" }
axum-messages =                         { version = "0.8.0" }
axum-sessions =                         { version = "0.6.1" }

askama =                                { version = "0.14.0" }
serde =                                 { version = "1.0.228", features = ["derive"] }
tokio =                                 { version = "1.48.0", features = ["full"] }

tower =                                 { version = "0.5.2" }
tower-sessions =                        { version = "0.14.0", default-features = false, features = [ "signed" ] }
tower-sessions-sqlx-store =             { version = "0.15.0", features = ["sqlite"] }
tower-http =                            { version = "0.6.6", features = ["fs"] }
sysinfo =                               { version = "0.37.2" }
config =                                { version = "0.15.18" }

# Logging
tracing =                               { version = "0.1.41", features = ["log"] }
tracing-subscriber =                    { version = "0.3.20", features = [ "fmt", "env-filter"] }
anyhow =                                { version = "1.0.100" }

# Authentication
sqlx =                                  { version = "0.8.6", features = ["sqlite", "time", "runtime-tokio"] }
time =                                  { version = "0.3.30"}
thiserror =                             { version = "2.0.17" }
password-auth =                         { version = "1.0.0" }

[build-dependencies]
regex = "1.12.2"
